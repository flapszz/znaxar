databases:
  - name: znaxar-db
    plan: free

services:
  - name: znaxar
    type: web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    preDeployCommand: npm run db:migrate && node server/seed-admin.js && node server/seed-products.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: znaxar-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
