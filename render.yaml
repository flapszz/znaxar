databases:
  - name: znaxar-db
    plan: free

services:
  - name: znaxar
    type: web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm run db:migrate && node server/seed-admin.js && node server/seed-stock.js && node server/seed-products.js
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: znaxar-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      # СДЭК: интеграция выключена, пока ключи не заданы (значения вводит владелец в панели Render)
      - key: CDEK_CLIENT_ID
        sync: false
      - key: CDEK_CLIENT_SECRET
        sync: false
      - key: CDEK_MODE
        value: test
      - key: CDEK_FROM_CITY_CODE
        sync: false
      - key: CDEK_SHIPMENT_POINT
        sync: false
      - key: CDEK_SENDER_NAME
        sync: false
      - key: CDEK_SENDER_PHONE
        sync: false
      - key: CDEK_WEBHOOK_SECRET
        generateValue: true
